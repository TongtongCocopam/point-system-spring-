spring.application.name=point-system

spring.datasource.url=jdbc:postgresql://localhost:5433/point_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 공통 검증
valid.id.required = 아이디는 필수 입력 항목입니다
valid.required = {0}은(는) 필수 입력 항목입니다

# 포인트 관련
valid.point.positive = 적립 금액은 0보다 커야 합니다

# 사용자 / 계정 관련
valid.email.required = 이메일은 필수입니다
valid.email.format = 올바른 이메일 형식이어야 합니다
valid.password.required = 비밀번호는 필수입니다
valid.password.size = 비밀번호는 최소 {min}자 이상이어야 합니다
